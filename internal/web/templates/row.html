{{define "row"}}<li id="item-{{.ID}}" class="item{{if .Bought}} is-bought{{end}}">
  <button class="item__check" type="button"
          hx-post="/items/{{.ID}}/toggle" hx-target="#list" hx-swap="outerHTML"
          aria-pressed="{{.Bought}}"
          aria-label="Mark {{.Name}} as {{if .Bought}}still needed{{else}}bought{{end}}"></button>
  <button class="item__open" type="button"
          hx-get="/items/{{.ID}}" hx-target="#item-{{.ID}}" hx-swap="outerHTML"
          aria-label="Open {{.Name}}">
    <span class="item__name">{{.Name}}</span>
    {{if gt .Qty 1}}<span class="item__qty">&times;{{.Qty}}</span>{{end}}
    {{if .OptionCount}}<span class="item__links">{{.OptionCount}} link{{if ne .OptionCount 1}}s{{end}}</span>{{end}}
    {{if .Notes}}<span class="item__notes">{{.Notes}}</span>{{end}}
  </button>
  {{if .Bought}}
    {{if .ActualCents}}<div class="item__money"><strong>{{.ActualText}}</strong><span>Actual</span></div>{{end}}
  {{else if .BudgetCents}}
    <div class="item__money"><strong>{{.BudgetText}}</strong><span>Budget</span></div>
  {{else}}
    <button class="item__set-budget" type="button"
            hx-get="/items/{{.ID}}/edit" hx-target="#item-{{.ID}}" hx-swap="outerHTML"
            aria-label="Set budget for {{.Name}}">Set budget</button>
  {{end}}
</li>
{{end}}
